apiVersion: valkey.io/v1alpha1
kind: ValkeyCluster
metadata:
  name: cluster-sample-deployment
spec:
  shards: 3
  replicas: 1
  acl:
    users:
      # Valkey's open default user: any client, no password, every command.
      # For trying the cluster out; restrict or remove it in production.
      - name: default
        password:
          type: Any
        permissions: "~* &* +@all"
  workloadType: Deployment
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

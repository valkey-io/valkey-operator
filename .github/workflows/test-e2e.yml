name: E2E Tests

on:
  push:
    branches:
      - 'main'
  pull_request:

env:
  MANAGER_IMAGE: valkey/valkey-operator:v0.0.1

jobs:
  prepare:
    name: Prepare e2e matrix
    runs-on: ubuntu-latest
    outputs:
      buckets: ${{ steps.set.outputs.buckets }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          cache: false  # using actions/cache below for the Go build cache

      # Cache: setup-go's built-in cache saves only once per go.mod hash and
      # won't update it on subsequent runs, so it can't keep a warm build
      # cache. github.sha key saves every run; restore-keys reuses the latest.
      - name: Cache Go build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-e2e-${{ runner.os }}-${{ hashFiles('.go-version', '**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-e2e-${{ runner.os }}-${{ hashFiles('.go-version', '**/go.sum') }}-
            go-build-e2e-${{ runner.os }}-

      # A test can match two buckets via its own or inherited Describe/Context
      # labels; fail if a test would run twice across the matrix.
      - name: Verify no test is in two buckets
        run: make test-e2e-verify-buckets

      - name: Generate matrix buckets
        id: set
        run: echo "buckets=$(make -s test-e2e-matrix)" >> "$GITHUB_OUTPUT"

      # Build the image once and provide it to the matrix jobs as an artifact.
      - name: Build operator image
        run: make docker-build IMG="$MANAGER_IMAGE"

      - name: Save operator image to tarball
        run: docker save "$MANAGER_IMAGE" -o /tmp/operator-image.tar

      - name: Upload operator image tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: operator-image
          path: /tmp/operator-image.tar
          retention-days: 1

  test-e2e:
    name: e2e (filter=${{ matrix.bucket }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bucket: ${{ fromJSON(needs.prepare.outputs.buckets) }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          cache: false  # using actions/cache below for the Go build cache

      - name: Cache Go build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-e2e-${{ runner.os }}-${{ hashFiles('.go-version', '**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-e2e-${{ runner.os }}-${{ hashFiles('.go-version', '**/go.sum') }}-
            go-build-e2e-${{ runner.os }}-

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Download operator image tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: operator-image
          path: /tmp

      - name: Load operator image from tarball
        run: docker load -i /tmp/operator-image.tar

      - name: Running Test e2e
        env:
          E2E_SKIP_IMAGE_BUILD: "true"
          E2E_MANAGER_IMAGE: ${{ env.MANAGER_IMAGE }}
        run: make test-e2e TEST_LABELS="${{ matrix.bucket }}"

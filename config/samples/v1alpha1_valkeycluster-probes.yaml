apiVersion: valkey.io/v1alpha1
kind: ValkeyCluster
metadata:
  name: cluster-sample-probes
spec:
  shards: 3
  replicasPerShard: 1
  acl:
    users:
      # Valkey's open default user: any client, no password, every command.
      # For trying the cluster out; restrict or remove it in production.
      - name: default
        password:
          type: Any
        permissions: "~* &* +@all"
  # Each field set here replaces one default; see the Probes section of
  # docs/valkeycluster.md. Changing probes rolls the pods.
  probes:
    startup:
      # 120 checks at the default period of 5s: 600s for the server to answer.
      failureThreshold: 120
    liveness:
      # The kubelet no longer restarts a busy or hung server container; a hung
      # primary is failed over by the cluster and stays up but not Ready.
      mode: Disabled
    readiness:
      periodSeconds: 10
      # Valkey has 3s to answer; the probe's own timeout is 4s.
      timeoutSeconds: 3
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

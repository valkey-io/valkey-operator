version: "2"
run:
  allow-parallel-runners: true
  go: "1.26"
  relative-path-mode: gomod
linters:
  default: none
  enable:
    - copyloopvar
    - depguard
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - modernize
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - logcheck
    - kubeapilinter
  settings:
    custom:
      logcheck:
        type: "module"
        description: Checks Go logging calls for Kubernetes logging conventions.
      kubeapilinter:
        type: "module"
        description: Checks Kubernetes API types against Kubernetes API conventions.
        original-url: sigs.k8s.io/kube-api-linter
        settings:
          linters:
            disable:
              - "*"
            enable:
              - arrayofstruct
              - duplicatemarkers
              - optionalorrequired
              - ssatags
              - uniquemarkers
    depguard:
      rules:
        forbid-sort-pkg:
          deny:
            - pkg: sort
              desc: Should be replaced with slices package
    goconst:
      # TODO update tests to fix goconst lint later.
      ignore-tests: true
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    modernize:
      disable:
        - omitzero
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      - path: _test\.go
        # Allow repeated strings in tests.
        linters:
          - goconst
      - linters:
          - kubeapilinter
        path-except: ^api/
      - linters:
          - kubeapilinter
        path: _test\.go$
      - linters:
          - kubeapilinter
        path: ^api/v1alpha1/valkeycluster_types\.go$
        # TODO(#476): TrustSource enforces its union via a hand-written XValidation CEL rule
        # rather than +kubebuilder:validation:ExactlyOneOf. Migrate TrustSource to ExactlyOneOf
        # in a follow-up PR or during v1beta1 promotion (#662) and remove this exclusion.
        text: "^arrayofstruct: TLSClientAuthSpec\\.CA\\b"
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

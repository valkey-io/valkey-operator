apiVersion: valkey.io/v1alpha1
kind: ValkeyCluster
metadata:
  labels:
    app.kubernetes.io/name: valkey-operator
    app.kubernetes.io/managed-by: kustomize
  name: cluster-sample-topology-spread
spec:
  shards: 3
  replicasPerShard: 1
  acl:
    users:
      # Valkey's open default user: any client, no password, every command.
      # For trying the cluster out; restrict or remove it in production.
      - name: default
        password:
          type: Any
        permissions: "~* &* +@all"
  scheduling:
    node:
      spread:
        shard:
          mode: Required
        primaries:
          mode: Disabled
        pods:
          mode: Preferred
    zone:
      spread:
        shard:
          mode: Preferred
        primaries:
          mode: Disabled
        pods:
          mode: Disabled

apiVersion: valkey.io/v1alpha1
kind: ValkeyCluster
metadata:
  name: cluster-readonly-rootfs-persistent-sample
spec:
  shards: 1
  replicasPerShard: 1
  acl:
    users:
      # Valkey's open default user: any client, no password, every command.
      # For trying the cluster out; restrict or remove it in production.
      - name: default
        password:
          type: Any
        permissions: "~* &* +@all"
  persistence:
    size: 1Gi
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 56849
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  exporter:
    enabled: true
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      runAsNonRoot: true
      runAsUser: 56850
      runAsGroup: 56850
      seccompProfile:
        type: RuntimeDefault
  containers:
    - name: server
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
        runAsUser: 56849
        runAsGroup: 56849
        seccompProfile:
          type: RuntimeDefault